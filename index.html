<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fdfdfc" />
    <meta name="description" content="Penjejak peribadi untuk jadual suntikan Mounjaro, berat badan, glukosa darah dan nota kesan sampingan. Semua data kekal dalam peranti anda." />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Penjejak Mounjaro</title>
    <script>
      // Apply the saved theme before the first paint (no light flash in dark mode).
      (function () {
        var theme = 'system';
        try { theme = localStorage.getItem('mjt-theme') || 'system'; } catch (e) {}
        var dark = theme === 'dark' || (theme === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        try { var l = localStorage.getItem('mjt-lang'); if (l === 'en' || l === 'ms') document.documentElement.lang = l; } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-JSxNYMk3.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CcexbA96.css">
  </head>

    <div id="root"></div>
    <noscript>Aplikasi ini memerlukan JavaScript. / This app needs JavaScript.</noscript>
  </body>
</html>
